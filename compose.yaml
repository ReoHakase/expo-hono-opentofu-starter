x-runtime: &runtime
  image: ${COMPOSE_PROJECT_NAME}-dev
  build:
    context: .
    dockerfile: .devcontainer/Dockerfile
  init: true
  user: node
  working_dir: ${WORKTREE_ROOT:?Run sh scripts/worktree-init.sh first}
  environment: &environment
    NODE_ENV: development
    DATABASE_URL: postgresql://expo-hono-opentofu-starter:starter@postgres:5432/expo-hono-opentofu-starter
    DEV_API_ORIGIN: https://api.${COMPOSE_PROJECT_NAME}.localhost
    DEV_METRO_ORIGIN: https://metro.${COMPOSE_PROJECT_NAME}.localhost
    BUN_INSTALL_CACHE_DIR: ${WORKTREE_ROOT}/node_modules/.cache/bun
  volumes:
    - type: bind
      source: ${WORKTREE_ROOT}
      target: ${WORKTREE_ROOT}
    - type: bind
      source: ${WORKTREE_GIT_COMMON_DIR:?Run sh scripts/worktree-init.sh first}
      target: ${WORKTREE_GIT_COMMON_DIR}
    - root-modules:${WORKTREE_ROOT}/node_modules
    - mobile-modules:${WORKTREE_ROOT}/apps/mobile/node_modules
    - api-modules:${WORKTREE_ROOT}/apps/api/node_modules
    - emulate-modules:${WORKTREE_ROOT}/apps/emulate/node_modules
    - shared-modules:${WORKTREE_ROOT}/packages/shared/node_modules
    - gcloud-config:/home/node/.config/gcloud
    - expo-config:/home/node/.expo

services:
  setup:
    <<: *runtime
    user: root
    command:
      - sh
      - -ec
      - |
        chown -R node:node node_modules apps/mobile/node_modules apps/api/node_modules apps/emulate/node_modules packages/shared/node_modules /home/node/.expo /home/node/.config/gcloud
        exec sudo -u node -H sh -ec 'bun install --frozen-lockfile --ignore-scripts && bun run setup'
  migrate:
    <<: *runtime
    command: bun run --cwd apps/api db:migrate
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
  api:
    <<: *runtime
    environment:
      <<: *environment
      PORT: '8080'
      AUTH_EMULATE: 'true'
      GOOGLE_EMULATOR_URL: http://google:4002
      APPLE_EMULATOR_URL: http://apple:4004
      GOOGLE_EMULATOR_PUBLIC_URL: https://google.${COMPOSE_PROJECT_NAME}.localhost
      APPLE_EMULATOR_PUBLIC_URL: https://apple.${COMPOSE_PROJECT_NAME}.localhost
      RESEND_API_URL: http://mail:4005
      PASSKEY_RP_ID: ${COMPOSE_PROJECT_NAME}.localhost
      PASSKEY_ORIGINS: https://metro.${COMPOSE_PROJECT_NAME}.localhost
    command: bun run --cwd apps/api dev
    stop_signal: SIGINT
    ports: ['127.0.0.1:8080:8080']
    labels:
      portless.ports: '8080'
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/ready']
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      migrate:
        condition: service_completed_successfully
      google:
        condition: service_started
      apple:
        condition: service_started
      mail:
        condition: service_started
  google:
    <<: *runtime
    environment:
      <<: *environment
      EMULATE_SERVICE: google
      EMULATE_HOST: 0.0.0.0
      EMULATE_PUBLIC_URL: https://google.${COMPOSE_PROJECT_NAME}.localhost
      PORT: '4002'
    command: bun run --cwd apps/emulate dev
    ports: ['127.0.0.1:4002:4002']
    labels: { portless.ports: '4002' }
    depends_on:
      setup:
        condition: service_completed_successfully
  apple:
    <<: *runtime
    environment:
      <<: *environment
      EMULATE_SERVICE: apple
      EMULATE_HOST: 0.0.0.0
      EMULATE_PUBLIC_URL: https://apple.${COMPOSE_PROJECT_NAME}.localhost
      PORT: '4004'
    command: bun run --cwd apps/emulate dev
    ports: ['127.0.0.1:4004:4004']
    labels: { portless.ports: '4004' }
    depends_on:
      setup:
        condition: service_completed_successfully
  mail:
    <<: *runtime
    environment:
      <<: *environment
      EMULATE_SERVICE: resend
      EMULATE_HOST: 0.0.0.0
      EMULATE_PUBLIC_URL: https://mail.${COMPOSE_PROJECT_NAME}.localhost
      PORT: '4005'
    command: bun run --cwd apps/emulate dev
    ports: ['127.0.0.1:4005:4005']
    labels: { portless.ports: '4005' }
    depends_on:
      setup:
        condition: service_completed_successfully
  metro:
    <<: *runtime
    tty: true
    stdin_open: true
    environment:
      <<: *environment
      EXPO_PACKAGER_PROXY_URL: https://metro.${COMPOSE_PROJECT_NAME}.localhost
    command: bun run --cwd apps/mobile dev
    stop_signal: SIGINT
    ports: ['127.0.0.1:8081:8081']
    labels:
      portless.ports: '8081'
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8081/status']
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      setup:
        condition: service_completed_successfully
  workspace:
    <<: *runtime
    image: ${COMPOSE_PROJECT_NAME}-workspace
    profiles: [editor]
    command: sleep infinity
    depends_on:
      migrate:
        condition: service_completed_successfully
  api-tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate --protocol http2 --url http://api:8080
    depends_on:
      api:
        condition: service_healthy
  postgres:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_USER: expo-hono-opentofu-starter
      POSTGRES_PASSWORD: starter
      POSTGRES_DB: expo-hono-opentofu-starter
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U expo-hono-opentofu-starter -d expo-hono-opentofu-starter',
        ]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  root-modules:
  mobile-modules:
  api-modules:
  emulate-modules:
  shared-modules:
  gcloud-config:
  expo-config:
  postgres-data:
