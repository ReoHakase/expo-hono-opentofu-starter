appId: ${APP_ID}
---
- tapOn: ${TAB}
- runFlow:
    when:
      true: ${STATE === 'loading'}
    commands:
      - extendedWaitUntil:
          visible:
            id: feed-loading
          timeout: 25000
      - assertNotVisible: まだ投稿がありません
- runFlow:
    when:
      true: ${STATE !== 'loading'}
    commands:
      - extendedWaitUntil:
          visible: ${STATE}
          timeout: 25000
- takeScreenshot: ${CAPTURE}
