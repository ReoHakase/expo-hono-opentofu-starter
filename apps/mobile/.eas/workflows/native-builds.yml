name: Native builds
defaults:
  tools:
    node: '24.19.0'
    bun: '1.4.4'
on:
  workflow_dispatch:
    inputs:
      ios_profile:
        type: choice
        description: Preview targets Simulator; development needs Apple device signing.
        options: [preview, development]
        default: preview
        required: true
      android_profile:
        type: choice
        description: Preview runs standalone; development connects to Metro.
        options: [preview, development]
        default: preview
        required: true
jobs:
  ios:
    type: build
    params:
      platform: ios
      profile: ${{ inputs.ios_profile }}
  android:
    type: build
    params:
      platform: android
      profile: ${{ inputs.android_profile }}
