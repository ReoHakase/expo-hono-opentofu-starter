name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-bookworm
        env:
          POSTGRES_USER: expo-hono-opentofu-starter
          POSTGRES_PASSWORD: starter
          POSTGRES_DB: expo-hono-opentofu-starter
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U expo-hono-opentofu-starter -d expo-hono-opentofu-starter"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Verify generated UI types
        run: |
          bun run --cwd apps/mobile styles:generate
          git diff --exit-code -- apps/mobile/uniwind-types.d.ts
      - run: bun run check
      - name: Test the API against PostgreSQL
        env:
          DATABASE_URL: postgresql://expo-hono-opentofu-starter:starter@localhost:5432/expo-hono-opentofu-starter
        run: bun run --cwd apps/api db:migrate && bun run --cwd apps/api test:integration
      - run: bun run doctor
      - run: bun run export:mobile
      - name: Commit conventions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mobile-bundles
          path: apps/mobile/dist
          retention-days: 7
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.13.8
      - uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: v0.65.0
      - run: tofu fmt -check -recursive infra
      - run: tofu -chdir=infra init -backend=false -lockfile=readonly
      - run: tofu -chdir=infra validate
      - run: tofu -chdir=infra/bootstrap init -backend=false -lockfile=readonly
      - run: tofu -chdir=infra/bootstrap validate
      - run: tflint --init
      - run: tflint --chdir=infra --config="$GITHUB_WORKSPACE/.tflint.hcl"
      - run: tflint --chdir=infra/bootstrap --config="$GITHUB_WORKSPACE/.tflint.hcl"
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate local Compose configurations
        env:
          DEVICE_API_ORIGIN: https://api.starter-ci.localhost
          DEVICE_METRO_ORIGIN: https://metro.starter-ci.localhost
          DEVICE_EXPO_ORIGIN: exps://metro.starter-ci.localhost
          DEVICE_GOOGLE_ORIGIN: https://google.starter-ci.localhost
          DEVICE_APPLE_ORIGIN: https://apple.starter-ci.localhost
          DEVICE_MAIL_ORIGIN: https://mail.starter-ci.localhost
        run: |
          sh scripts/worktree-init.sh
          docker compose --profile editor --profile tunnel config --quiet
          docker compose -f compose.yaml -f compose.go.yaml config --quiet
          docker compose -f compose.yaml -f compose.devices.yaml config --quiet
      - run: docker build --tag expo-hono-opentofu-starter-api --file apps/api/Dockerfile .
      - name: Run Node.js container smoke test
        run: |
          docker run -d --name api -p 8080:8080 \
            -e DATABASE_URL=postgresql://unused:unused@localhost:5432/unused \
            -e BETTER_AUTH_SECRET=ci-only-secret-not-for-real-deployments \
            -e BETTER_AUTH_URL=https://example.com expo-hono-opentofu-starter-api
          for _ in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
